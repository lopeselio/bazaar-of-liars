[package]
name = "bazaar"
description = "Bazaar of Liars: commit-reveal haggles settled only if the merchant played fair"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/lopeselio/bazaar-of-liars"

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible WASM build settings (NEP-330), from the `cargo near new` template.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "~5.29"

[dev-dependencies]
near-sdk = { version = "~5.29", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
